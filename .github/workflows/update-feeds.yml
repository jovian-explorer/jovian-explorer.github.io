name: Update video and article lists

# Refreshes assets/js/feed-videos.js (YouTube), assets/js/feed-articles.js
# (Medium) and assets/js/feed-metrics.js (Google Scholar citations) with tools/update_feeds.py and commits them when they change.
# Optional repository secret YT_API_KEY (YouTube Data API v3) gives the full
# upload list with durations; without it the channel pages and RSS are used.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [testing]
    paths:
      - tools/update_feeds.py
      - .github/workflows/update-feeds.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: update-feeds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch YouTube and Medium lists
        run: python3 tools/update_feeds.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- assets/js/feed-videos.js assets/js/feed-articles.js assets/js/feed-metrics.js; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/feed-videos.js assets/js/feed-articles.js assets/js/feed-metrics.js
          git commit -m "Update video and article lists"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true' && github.ref_name == github.event.repository.default_branch
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
