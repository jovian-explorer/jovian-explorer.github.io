name: One-off site lookup
on:
  push:
    branches: [testing]
    paths: [tools/lookup_sites.py, .github/workflows/lookup-sites.yml]
permissions:
  contents: write
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/lookup_sites.py > tools/sites-crawl.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sites-crawl.txt
          git commit -m "Temporary: crawl output"
          git push
