name: One-off fetch channel avatar
on:
  push:
    branches: [testing]
    paths: [.github/workflows/fetch-avatar.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - <<'PY'
          import re, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) Chrome/126", "Cookie": "CONSENT=YES+cb; SOCS=CAI"}
          h = urllib.request.urlopen(urllib.request.Request("https://www.youtube.com/@keshavagg1098", headers=UA), timeout=60).read().decode("utf-8", "replace")
          m = re.search(r'<meta property="og:image" content="([^"]+)"', h) or re.search(r'"avatar":\{"thumbnails":\[\{"url":"([^"]+)"', h)
          url = re.sub(r"=s\d+", "=s1200", m.group(1).replace("\\u0026", "&"))
          print("avatar", url)
          data = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()
          open("assets/img/channel-avatar.jpg", "wb").write(data)
          print(len(data), "bytes")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/channel-avatar.jpg
          git commit -m "Channel avatar"
          git push
